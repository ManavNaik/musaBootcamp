<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        .heading{

            background: yellow;
        }

        #special_heading{
            color: blue;

        }

        h1{

        }

        .span{
            margin: 20px;
            padding: 40px;

        }

        .internal{
            color: blue;
        }
    
    </style>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <H1 class="heading" id="special_heading" >Manav Naik</H1>
    <H1 class="heading" >Manav Naik</H1>
    <H1>Manav Naik</H1>

    <span class="span" >Manav Naik</span>
    <span class="span" >Manav Naik</span>
    
    
    <span class="inline" style="color:red" >Inline</span>
    <span class="internal" >internal</span>
    <span class="external" >external</span>

</html>
